<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#F5A623"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Alpha Ads"/>
<title>{{ nome }} — Alpha Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>window.__TOKEN__="{{ token }}";window.__PERIODO__="{{ periodo }}";</script>
<style>
:root{
  --gold:#F5A623;--gold2:#d4891c;--gold-glow:rgba(245,166,35,.2);
  --dark:#0d0d0d;--d2:#111;--d3:#161616;--d4:#1c1c1c;--d5:#222;--d6:#2a2a2a;
  --border:#252525;--border2:#2e2e2e;
  --text:#f0f0f0;--muted:#777;--muted2:#444;
  --green:#22c55e;--green-bg:rgba(34,197,94,.12);
  --red:#ef4444;--red-bg:rgba(239,68,68,.1);
  --r:14px;--rs:9px;--rxs:6px
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
     background:var(--dark);color:var(--text);display:flex;flex-direction:column}

/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--d6);border-radius:99px}

/* ══ LAYOUT ══ */
#app{display:flex;flex-direction:column;height:100%;overflow:hidden}

/* ── TOP BAR ── */
.topbar{
  background:var(--d2);border-bottom:1px solid var(--border);
  padding:0 16px;height:58px;display:flex;align-items:center;gap:12px;
  flex-shrink:0;position:relative;z-index:10
}
.topbar-logo{width:36px;height:36px;flex-shrink:0}
.topbar-info{flex:1;min-width:0}
.topbar-agency{font-size:10px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.topbar-client{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ── PERIOD TABS ── */
.period-bar{
  background:var(--d2);border-bottom:1px solid var(--border);
  padding:0 16px;display:flex;align-items:center;gap:6px;
  overflow-x:auto;flex-shrink:0;height:46px;
  scrollbar-width:none
}
.period-bar::-webkit-scrollbar{display:none}
.ptab{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  font-size:12px;font-weight:600;padding:5px 13px;border-radius:99px;
  cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0
}
.ptab:hover{border-color:var(--gold);color:var(--gold)}
.ptab.active{background:var(--gold-glow);border-color:var(--gold);color:var(--gold)}

/* ── SCROLL AREA ── */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.inner{padding:14px 14px 100px;max-width:900px;margin:0 auto}

/* ── METRICS GRID ── */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:600px){.metrics{grid-template-columns:repeat(4,1fr)}}
.mcard{
  background:var(--d3);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 12px;position:relative;overflow:hidden
}
.mcard::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.mcard.loaded::after{transform:scaleX(1)}
.mc-icon{font-size:18px;margin-bottom:6px}
.mc-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin-bottom:4px}
.mc-value{font-size:18px;font-weight:800;line-height:1;letter-spacing:-.5px}
.mc-sub{font-size:10px;color:var(--muted2);margin-top:4px}
@media(min-width:600px){.mc-value{font-size:20px}}

/* ── CHART CARDS ── */
.charts{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:14px}
@media(min-width:600px){.charts{grid-template-columns:1fr 1fr}}
.card{background:var(--d3);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}

/* ── CAMPAIGN TABLE ── */
.camp-card{background:var(--d3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.camp-header{padding:14px 14px 10px;display:flex;align-items:center;justify-content:space-between}
.camp-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:600;padding:8px 12px;
   border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;
   letter-spacing:.5px;white-space:nowrap;background:var(--d4)}
td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text)}
tr:last-child td{border-bottom:none}
tbody tr:active td{background:rgba(255,255,255,.03)}
.tname{font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.badge-on{background:var(--green-bg);color:var(--green)}
.badge-on::before,.badge-off::before{content:'';width:4px;height:4px;border-radius:50%;display:inline-block}
.badge-on::before{background:var(--green)}
.badge-off{background:var(--d5);color:var(--muted)}
.badge-off::before{background:var(--muted)}
.roas-good{color:var(--green);font-weight:700}
.roas-ok{color:var(--gold);font-weight:700}

/* ── STATES ── */
.state-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:14px;text-align:center}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.state-msg{font-size:14px;color:var(--muted)}
.err-box{background:var(--red-bg);border:1px solid rgba(239,68,68,.2);border-radius:var(--r);padding:16px;margin:14px}
.err-title{font-size:14px;font-weight:700;color:#f87171;margin-bottom:4px}
.err-msg{font-size:12px;color:var(--muted)}

/* ── BUTTONS ── */
.btn-gold{background:var(--gold);color:#000;border:none;border-radius:var(--rs);
          height:36px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer;
          display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.btn-gold:hover{background:var(--gold2)}
.btn-gold:active{transform:scale(.97)}
.btn-icon{background:var(--d4);border:1px solid var(--border2);color:var(--muted);
          border-radius:var(--rs);width:36px;height:36px;display:flex;align-items:center;
          justify-content:center;cursor:pointer;font-size:16px;transition:all .15s;flex-shrink:0}
.btn-icon:hover{border-color:var(--gold);color:var(--gold)}
.btn-icon:active{transform:scale(.93)}

/* ── DATE PICKER MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;
          display:flex;align-items:flex-end;justify-content:center;
          opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--d3);border:1px solid var(--border2);border-radius:20px 20px 0 0;
       padding:20px;width:100%;max-width:480px;transform:translateY(100%);transition:transform .25s}
.modal-bg.open .modal{transform:translateY(0)}
.modal-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--gold)}
.modal label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:600;letter-spacing:.3px}
.modal input[type=date]{
  width:100%;height:44px;background:var(--d4);border:1px solid var(--border2);
  border-radius:var(--rs);padding:0 12px;font-size:14px;color:var(--text);
  outline:none;margin-bottom:12px
}
.modal input[type=date]:focus{border-color:var(--gold)}
.modal-actions{display:flex;gap:10px;margin-top:4px}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--muted);
             border-radius:var(--rs);height:44px;flex:1;font-size:14px;font-weight:600;cursor:pointer}
.btn-outline:active{transform:scale(.97)}

/* ── BOTTOM NAV (mobile feel) ── */
.bottomnav{
  background:var(--d2);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  padding:8px 0 max(8px,env(safe-area-inset-bottom));
  flex-shrink:0;gap:6px;flex-wrap:wrap;padding-left:8px;padding-right:8px
}
.bnav-info{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--green);
          animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── PWA INSTALL BANNER ── */
.install-banner{
  background:linear-gradient(90deg,var(--d4),var(--d3));
  border:1px solid var(--border2);border-radius:var(--r);
  padding:12px 14px;margin:0 0 14px;
  display:flex;align-items:center;gap:12px
}
.install-banner .ib-icon{font-size:24px;flex-shrink:0}
.install-banner .ib-text{flex:1;min-width:0}
.ib-title{font-size:13px;font-weight:700;color:var(--text)}
.ib-sub{font-size:11px;color:var(--muted);margin-top:2px}
.ib-close{color:var(--muted);background:none;border:none;font-size:18px;cursor:pointer;flex-shrink:0;padding:0 4px}

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <svg class="topbar-logo" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#1a1a1a"/><polygon points="18,78 50,18 63,42 37,42 50,66 76,18 88,42 50,82" fill="#F5A623"/></svg>
    <div class="topbar-info">
      <div class="topbar-agency">Assessoria Alpha · Nieri Santos &amp; Com</div>
      <div class="topbar-client">{{ nome }}</div>
    </div>
    <div class="topbar-actions">
      <button class="btn-icon" id="refreshBtn" onclick="loadData()">↺</button>
    </div>
  </div>
  <div class="period-bar">
    <button class="ptab" data-preset="last_7d" onclick="setPreset('last_7d',this)">7 dias</button>
    <button class="ptab" data-preset="last_14d" onclick="setPreset('last_14d',this)">14 dias</button>
    <button class="ptab active" data-preset="last_30d" onclick="setPreset('last_30d',this)">30 dias</button>
    <button class="ptab" data-preset="this_month" onclick="setPreset('this_month',this)">Este mês</button>
    <button class="ptab" data-preset="last_90d" onclick="setPreset('last_90d',this)">90 dias</button>
    <button class="ptab" id="tabCustom" onclick="setPreset('custom',this)">✏ Período</button>
  </div>
  <div class="scroll-area">
    <div class="inner">
      <div class="install-banner" id="installBanner" style="display:none">
        <div class="ib-icon">📲</div>
        <div class="ib-text"><div class="ib-title">Instalar como app</div><div class="ib-sub">Acesse mais rápido</div></div>
        <button class="btn-gold" style="height:32px;padding:0 12px;font-size:12px" onclick="installApp()">Instalar</button>
        <button class="ib-close" onclick="dismissInstall()">×</button>
      </div>
      <div id="loadingState" class="state-wrap">
        <div class="spinner"></div>
        <div class="state-msg">Buscando dados do Meta Ads…</div>
      </div>
      <div id="errBox" class="err-box" style="display:none">
        <div class="err-title" id="errTitle">Erro</div>
        <div class="err-msg" id="errMsg"></div>
      </div>
      <div id="contentArea" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px">
          <div style="font-size:14px;font-weight:700;color:var(--text)" id="periodLabel"></div>
          <div style="font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px">
            <span class="dot-live"></span><span>Atualizado às <span id="lastUpd"></span></span>
          </div>
        </div>
        <div class="metrics" id="metricsGrid"></div>
        <div class="charts">
          <div class="card"><div class="card-title">Investimento diário</div><div style="position:relative;height:180px"><canvas id="spendChart"></canvas></div></div>
          <div class="card"><div class="card-title">Compras por dia</div><div style="position:relative;height:180px"><canvas id="purchChart"></canvas></div></div>
        </div>
        <div class="camp-card">
          <div class="camp-header">
            <div class="card-title" style="margin:0">Campanhas</div>
            <div style="font-size:11px;color:var(--muted)" id="campCount"></div>
          </div>
          <div class="camp-scroll">
            <table>
              <thead><tr><th>Campanha</th><th>Status</th><th>Investido</th><th>Alcance</th><th>Impressões</th><th>Cliques</th><th>CTR</th><th>CPM</th><th>CPC</th><th>Compras</th><th>Custo/Compra</th><th>ROAS</th></tr></thead>
              <tbody id="campBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="bottomnav"><div class="bnav-info"><span class="dot-live"></span><span>Meta Ads · Windsor.ai</span></div></div>
</div>
<div class="modal-bg" id="dateModal" onclick="if(event.target===this)closeDateModal()">
  <div class="modal">
    <div class="modal-title">Escolher período</div>
    <label>Data inicial</label><input type="date" id="mDateFrom"/>
    <label>Data final</label><input type="date" id="mDateTo"/>
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeDateModal()">Cancelar</button>
      <button class="btn-gold" style="flex:1;height:44px;font-size:14px" onclick="applyCustomDate()">Aplicar</button>
    </div>
  </div>
</div>
<script>
// ── utils ──
const f  = (n,d=2)=>isNaN(+n)||n==null?'—':(+n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fi = n=>isNaN(+n)||n==null?'—':(+n).toLocaleString('pt-BR');
const fr = n=>n&&+n?'R$\u00a0'+f(n):'—';

const LABELS={last_7d:'7 dias',last_14d:'14 dias',last_30d:'30 dias',this_month:'Este mês',last_90d:'90 dias'};

let sChart=null, pChart=null, deferredInstall=null;
let activePreset='last_30d', activeCustomFrom='', activeCustomTo='';

// ── aggregate helpers ──
function aggCamps(data){
  const m={};
  data.forEach(r=>{
    const k=r.campaign||'Sem nome';
    if(!m[k]) m[k]={n:k,st:r.account_status||'—',sp:0,im:0,re:0,cl:0,pu:0,rs:0,rc:0};
    m[k].sp+=+(r.spend||0); m[k].im+=+(r.impressions||0);
    m[k].re+=+(r.reach||0); m[k].cl+=+(r.clicks||0); m[k].pu+=+(r.purchases||0);
    if(r.purchase_roas){m[k].rs+=+(r.purchase_roas);m[k].rc++;}
  });
  return Object.values(m).sort((a,b)=>b.sp-a.sp);
}

function aggDate(data){
  const m={};
  data.forEach(r=>{
    if(!r.date) return;
    if(!m[r.date]) m[r.date]={sp:0,pu:0};
    m[r.date].sp+=+(r.spend||0); m[r.date].pu+=+(r.purchases||0);
  });
  const dates=Object.keys(m).sort();
  return {dates, spend:dates.map(d=>+m[d].sp.toFixed(2)), purch:dates.map(d=>m[d].pu)};
}

// ── render metrics ──
function renderMetrics(data){
  const t=data.reduce((a,r)=>({
    sp:a.sp++(r.spend||0),im:a.im++(r.impressions||0),
    re:a.re++(r.reach||0),cl:a.cl++(r.clicks||0),pu:a.pu++(r.purchases||0)
  }),{sp:0,im:0,re:0,cl:0,pu:0});
  const cpm=t.im?t.sp/t.im*1000:0, cpc=t.cl?t.sp/t.cl:0,
        ctr=t.im?t.cl/t.im*100:0,  cpp=t.pu?t.sp/t.pu:0;
  const cards=[
    {icon:'💰',label:'Investido',     value:'R$\u00a0'+f(t.sp), sub:'Total no período'},
    {icon:'👥',label:'Alcance',       value:fi(t.re),             sub:'Pessoas únicas'},
    {icon:'👁',label:'Impressões',    value:fi(t.im),             sub:'Exibições'},
    {icon:'🖱',label:'Cliques',       value:fi(t.cl),             sub:'CTR '+f(ctr,2)+'%'},
    {icon:'🛒',label:'Compras',       value:fi(t.pu),             sub:'Conversões'},
    {icon:'🧾',label:'Custo/Compra', value:fr(cpp),              sub:'Por conversão'},
    {icon:'📊',label:'CPM',           value:fr(cpm),              sub:'Mil impressões'},
    {icon:'🎯',label:'CPC',           value:fr(cpc),              sub:'Por clique'},
  ];
  const grid=document.getElementById('metricsGrid');
  grid.innerHTML=cards.map(c=>`
    <div class="mcard">
      <div class="mc-icon">${c.icon}</div>
      <div class="mc-label">${c.label}</div>
      <div class="mc-value">${c.value}</div>
      <div class="mc-sub">${c.sub}</div>
    </div>`).join('');
  setTimeout(()=>grid.querySelectorAll('.mcard').forEach((el,i)=>{
    setTimeout(()=>el.classList.add('loaded'),i*60);
  }),50);
}

// ── render table ──
function renderTable(camps){
  document.getElementById('campCount').textContent=camps.length+' campanhas';
  document.getElementById('campBody').innerHTML=camps.map(c=>{
    const cpm=c.im?c.sp/c.im*1000:0, cpc=c.cl?c.sp/c.cl:0,
          ctr=c.im?c.cl/c.im*100:0,  cpp=c.pu?c.sp/c.pu:0,
          roas=c.rc?c.rs/c.rc:0, on=c.st==='ACTIVE';
    const roasClass=roas>=2?'roas-good':roas>0?'roas-ok':'';
    return `<tr>
      <td class="tname" title="${c.n}">${c.n}</td>
      <td><span class="badge ${on?'badge-on':'badge-off'}">${on?'Ativa':'Pausada'}</span></td>
      <td>${fr(c.sp)}</td><td>${fi(c.re)}</td><td>${fi(c.im)}</td>
      <td>${fi(c.cl)}</td><td>${f(ctr,2)}%</td>
      <td>${fr(cpm)}</td><td>${fr(cpc)}</td>
      <td>${fi(c.pu)}</td><td>${fr(cpp)}</td>
      <td class="${roasClass}">${roas?f(roas,2)+'x':'—'}</td>
    </tr>`;
  }).join('');
}

// ── render charts ──
function renderCharts(bd){
  const lbs=bd.dates.map(d=>{const[,m,dy]=d.split('-');return`${dy}/${m}`;});
  const gc='rgba(255,255,255,.04)', tc='#555';
  const base={
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{
      backgroundColor:'#1c1c1c',titleColor:'#f0f0f0',bodyColor:'#888',
      borderColor:'#2e2e2e',borderWidth:1,padding:10,cornerRadius:8
    }},
    scales:{
      x:{ticks:{color:tc,font:{size:10},maxTicksLimit:8,autoSkip:true},grid:{color:gc},border:{display:false}},
      y:{ticks:{color:tc,font:{size:10}},grid:{color:gc},border:{display:false}}
    }
  };
  if(sChart){sChart.destroy();sChart=null;}
  if(pChart){pChart.destroy();pChart=null;}
  sChart=new Chart(document.getElementById('spendChart'),{type:'line',data:{labels:lbs,datasets:[{
    data:bd.spend,borderColor:'#F5A623',backgroundColor:'rgba(245,166,35,.07)',
    fill:true,tension:.4,pointRadius:bd.dates.length>25?0:3,
    borderWidth:2.5,pointBackgroundColor:'#F5A623',pointBorderColor:'#0d0d0d',pointBorderWidth:1.5
  }]},options:{...base,scales:{...base.scales,y:{...base.scales.y,
    ticks:{...base.scales.y.ticks,callback:v=>'R$'+Number(v).toLocaleString('pt-BR')}}}}});
  pChart=new Chart(document.getElementById('purchChart'),{type:'bar',data:{labels:lbs,datasets:[{
    data:bd.purch,backgroundColor:'rgba(245,166,35,.65)',
    borderRadius:4,hoverBackgroundColor:'#F5A623'
  }]},options:base});
}

// ── load data ──
async function loadData(){
  const btn=document.getElementById('refreshBtn');
  btn.textContent='…'; btn.disabled=true;
  document.getElementById('errBox').style.display='none';
  document.getElementById('contentArea').style.display='none';
  document.getElementById('loadingState').style.display='flex';

  const TOKEN=window.__TOKEN__;
  let url=`/api/data/${TOKEN}?`;
  if(activeCustomFrom&&activeCustomTo&&activePreset==='custom'){
    url+=`date_from=${activeCustomFrom}&date_to=${activeCustomTo}`;
  } else {
    url+=`date_preset=${activePreset}`;
  }

  try{
    const res=await fetch(url);
    const json=await res.json();
    if(!res.ok) throw new Error(json.error||'Erro desconhecido');
    const data=json.data||[];
    if(!data.length) throw new Error('Sem dados nesse período. Verifique se o Meta Ads está conectado no Windsor.ai.');

    // period label
    if(activePreset==='custom'&&activeCustomFrom&&activeCustomTo){
      document.getElementById('periodLabel').textContent=`${activeCustomFrom} → ${activeCustomTo}`;
    } else {
      document.getElementById('periodLabel').textContent=LABELS[activePreset]||activePreset;
    }
    const now=new Date();
    document.getElementById('lastUpd').textContent=
      now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

    renderMetrics(data);
    renderTable(aggCamps(data));
    renderCharts(aggDate(data));

    document.getElementById('loadingState').style.display='none';
    document.getElementById('contentArea').style.display='block';
  }catch(e){
    document.getElementById('loadingState').style.display='none';
    document.getElementById('errTitle').textContent='Erro ao carregar';
    document.getElementById('errMsg').textContent=e.message;
    document.getElementById('errBox').style.display='block';
  }
  btn.textContent='↺'; btn.disabled=false;
}

// ── period tabs ──
function setPreset(p,el){
  if(p==='custom'){ openDateModal(); return; }
  activePreset=p; activeCustomFrom=''; activeCustomTo='';
  document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  loadData();
}

// ── date modal ──
function openDateModal(){
  document.getElementById('dateModal').classList.add('open');
  const today=new Date().toISOString().slice(0,10);
  const ago30=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  document.getElementById('mDateFrom').value=activeCustomFrom||ago30;
  document.getElementById('mDateTo').value=activeCustomTo||today;
}
function closeDateModal(){
  document.getElementById('dateModal').classList.remove('open');
}
function applyCustomDate(){
  const df=document.getElementById('mDateFrom').value;
  const dt=document.getElementById('mDateTo').value;
  if(!df||!dt){ alert('Selecione as duas datas.'); return; }
  activeCustomFrom=df; activeCustomTo=dt; activePreset='custom';
  document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tabCustom').classList.add('active');
  closeDateModal();
  loadData();
}

// ── PWA install ──
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredInstall=e;
  document.getElementById('installBanner').style.display='flex';
});
function installApp(){
  if(!deferredInstall) return;
  deferredInstall.prompt();
  deferredInstall.userChoice.then(()=>{
    deferredInstall=null;
    document.getElementById('installBanner').style.display='none';
  });
}
function dismissInstall(){
  document.getElementById('installBanner').style.display='none';
}

// ── service worker ──
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

// ── init ──
document.addEventListener('DOMContentLoaded', ()=>{
  // set default active tab to match default preset
  const defTab = document.querySelector(`.ptab[data-preset="${window.__PERIODO__}"]`);
  if(defTab){ document.querySelectorAll('.ptab').forEach(b=>b.classList.remove('active')); defTab.classList.add('active'); activePreset=window.__PERIODO__; }
  loadData();
});

</script>
</body>
